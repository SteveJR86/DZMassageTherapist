<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Home page for DZ Massage Therapist, a business that offers theraueptic and sports massage to clients across the greater london area.">
        <title>DZ Massage Therapist - Bookings</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <header>
            <img class="logo" src="./assets/images/logo.png" alt="DZ Massage company logo" height="120" width="120" />
            <nav>
                <button class="navBtn" id="navBtn" aria-label="Show menu">
                    <img class="menuIcon" id="menuIcon" src="./assets/icons/bars-solid.svg" alt="" height="60" width="60" />
                </button>
                <ul class="menu menuHide" id="menu">
                    <li><a class="menuLink" href="./">Home</a></li>
                    <li><a class="menuLink" href="./location.html">Location & Contact</a></li>
                    <li><a class="menuLink" href="./bookings.html">Book a Massage</a></li>
                    <li><a class="menuLink" href="./treatments.html">Treatments</a></li>
                    <li><a class="menuLink" href="./reviews.html">Client Reviews</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div class="bookingSystemEmbed">
                <iframe id='cliniko-63880303' src='https://steve-riley-web-design.uk2.cliniko.com/bookings?embedded=true'
                    frameborder='0' scrolling='auto' width='100%' height='1000' style='pointer-events: auto;'></iframe>
                <script type='text/javascript'>
                    window.addEventListener('message', function handleIFrameMessage(e) {
                        var clinikoBookings = document.getElementById('cliniko-63880303');
                        if (typeof e.data !== 'string') return;
                        if (e.data.search('cliniko-bookings-resize') > -1) {
                            var height = Number(e.data.split(':')[1]);
                            clinikoBookings.style.height = height + 'px';
                        }
                        e.data.search('cliniko-bookings-page') > -1 && clinikoBookings.scrollIntoView();
                    });
                </script>
            </div>
        </main>
        <footer>
            <div class="websiteFooter">
                <p class="sectionHeading">DZ Massage Therapy</p>
                <div class="socialIcons">
                    <a href="https://instagram.com/dzsportsmassage?igshid=MzNlNGNkZWQ4Mg==" aria-label="DZ Massage Therapy's instagram page">
                        <img src="./assets/icons/instagram.svg" class="socialLinks" alt="Instagram logo">
                    </a>
                </div>
            </div>
            <p class="credit">Website created by <a class="srlink" href="mailto:steven.j.riley@gmail.com">Steve Riley Webdesigns</a></p>
        </footer>
    </body>
</html>
